appId: cn.pondclock.desktop
productName: PondClock
asar: true
electronDist: node_modules/electron/dist
extraResources:
  - from: desktop/assets/icon.ico
    to: icon.ico
directories:
  output: release
files:
  - desktop/**
  - build-desktop/**
  - src/domain/**
  - src/config/**
  - src/data/**
  - src/lib/gameConfig.js
  - package.json
  - '!**/*.map'
win:
  icon: desktop/assets/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  artifactName: PondClock-Setup-${version}-${arch}.${ext}
  signExecutable: false
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 水塘时钟
  deleteAppDataOnUninstall: false
