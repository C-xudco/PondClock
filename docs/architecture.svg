<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1060" viewBox="0 0 1360 1060" role="img" aria-labelledby="title desc">
  <title id="title">水塘时钟离线桌面版：实现架构与启动流程</title>
  <desc id="desc">v1.0.0分层架构。React通过会话协调调用纯函数规则，统一生成132条航线和504格市场；Electron隔离接口负责本地版本化存档。IP和天气是可降级的在线增强。底部为启动流程，独立监督贯穿各阶段。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#53758a"/></marker>
    <style>
      text{font-family:'Microsoft YaHei','Noto Sans CJK SC','Segoe UI',sans-serif;fill:#19374b}
      .h{font-size:22px;font-weight:700}.b{font-size:17px}.s{font-size:15px;fill:#4c6475}
      .line{stroke:#53758a;stroke-width:2;fill:none;marker-end:url(#arrow)}
      .label{font-size:13px;letter-spacing:1px;fill:#517083}
      .card{fill:#fff;stroke:#d3dfe5;stroke-width:1.5}
    </style>
  </defs>
  <rect width="1360" height="1060" fill="#f3f6f5"/>
  <text x="54" y="56" style="font-size:32px;font-weight:700">水塘时钟 · 离线桌面版开发蓝图</text>
  <text x="55" y="87" class="s">2026-10-20  /  v1.0.0 实现结构  /  验证范围见 ACCEPTANCE.md</text>
  <rect x="1090" y="34" width="214" height="40" rx="20" fill="#e3ebf6"/>
  <text x="1120" y="60" style="font-size:16px;fill:#335a87">Electron + React + JSON</text>

  <rect x="54" y="125" width="894" height="103" rx="16" class="card"/>
  <text x="78" y="159" class="label">表现层</text>
  <text x="78" y="190" class="h">时钟 / SVG 水塘 / 鱼篓 / 图鉴 / 商店 / 漫游</text>
  <text x="78" y="214" class="s">只显示统一报价和已提交状态；不在组件中写平衡公式</text>

  <rect x="54" y="264" width="894" height="104" rx="16" fill="#dceee9" stroke="#b5d6ca"/>
  <text x="78" y="298" class="label">应用层</text>
  <text x="78" y="329" class="h">会话协调：命令串行化 → 生成状态 → 保存成功 → 发布</text>
  <text x="78" y="353" class="s">完整交易 + 持久化命令 ID；结果未知则暂停并重读，防止重扣</text>
  <path d="M500 229V260" class="line"/>

  <rect x="54" y="408" width="426" height="145" rx="16" class="card"/>
  <text x="78" y="443" class="label">领域层 / 纯函数</text>
  <text x="78" y="476" class="h">钓鱼 · 资产 · 飞行 · 鱼龄</text>
  <text x="78" y="507" class="b">统一航线与市场报价 / 七天失效优先</text>
  <text x="78" y="532" class="s">可注入时钟、确定性输入与故障测试</text>
  <path d="M270 369V403" class="line"/>

  <rect x="510" y="408" width="438" height="145" rx="16" class="card"/>
  <text x="534" y="443" class="label">存储接口</text>
  <text x="534" y="476" class="h">版本化 SaveRepository</text>
  <text x="534" y="507" class="b">Electron 白名单 IPC → 主进程写入</text>
  <text x="534" y="532" class="s">固定 userData 路径 / 单实例 / 输入校验</text>
  <path d="M730 369V403" class="line"/>

  <rect x="54" y="591" width="426" height="146" rx="16" fill="#e5ecf8" stroke="#c2d1e8"/>
  <text x="78" y="626" class="label">数据与配置 / 唯一来源</text>
  <text x="78" y="659" class="h">地区坐标 / 鱼种 / 产出权重</text>
  <text x="78" y="690" class="b">派生 132 条有向航段 · 504 格市场</text>
  <text x="78" y="715" class="s">交通、经济、钓鱼、服务数值分区管理</text>
  <path d="M270 590V559" class="line"/>

  <rect x="510" y="591" width="438" height="146" rx="16" fill="#e5ecf8" stroke="#c2d1e8"/>
  <text x="534" y="626" class="label">本地记忆 / 整份快照</text>
  <text x="534" y="659" class="h">双槽 JSON / 备份 / 校验 / 迁移</text>
  <text x="534" y="690" class="b">鱼篓、捕获时刻、图鉴、资产、在途航程</text>
  <text x="534" y="715" class="s">保存绝对到达时间；导入 / 导出支持换电脑</text>
  <path d="M730 554V585" class="line"/>

  <rect x="988" y="125" width="318" height="299" rx="16" fill="#fff4db" stroke="#e7d4a6"/>
  <text x="1012" y="160" class="label">在线增强 / 可降级</text>
  <text x="1012" y="195" class="h">每次 IP 解锁现实水域</text>
  <text x="1012" y="227" class="s">免费进入现实水域；不强制瞬移</text>
  <path d="M1012 247H1280" stroke="#e7d4a6"/>
  <text x="1012" y="281" class="h">天气跟随电脑所在地</text>
  <text x="1012" y="314" class="b">在线服务 → 有效缓存 → 模拟</text>
  <text x="1012" y="346" class="s">显示来源 / 地区 / 更新时间</text>
  <text x="1012" y="378" class="s">超时、429、断网不阻塞游戏</text>
  <text x="1012" y="403" class="s">离线无法刷新真实天气</text>
  <path d="M949 314H980" class="line"/>

  <rect x="988" y="461" width="318" height="276" rx="16" fill="#203c50"/>
  <text x="1012" y="498" class="h" style="fill:#fff">Leader + 独立监督</text>
  <text x="1012" y="535" class="b" style="fill:#e2edf2">规则 / 存档 / 服务分别负责</text>
  <text x="1012" y="568" class="b" style="fill:#e2edf2">每阶段审差异、检查证据</text>
  <text x="1012" y="601" class="b" style="fill:#e2edf2">边界 / 故障 / 重启 / 断网测试</text>
  <text x="1012" y="644" class="s" style="fill:#b5ccd8">通过 / 失败 / 未测 分别记录</text>
  <text x="1012" y="675" class="s" style="fill:#b5ccd8">README + 决策 + 验收 + 技术债</text>
  <text x="1012" y="708" class="s" style="fill:#b5ccd8">构建通过不等于功能交付完成</text>

  <text x="54" y="790" class="h">启动与恢复流程</text>
  <rect x="54" y="812" width="191" height="70" rx="13" class="card"/>
  <text x="78" y="842" class="b">启动本地程序</text>
  <text x="78" y="867" class="s">无需 Node / 开发服务器</text>
  <path d="M246 846H280" class="line"/>
  <rect x="286" y="812" width="207" height="70" rx="13" class="card"/>
  <text x="310" y="842" class="b">读档 / 校验 / 恢复</text>
  <text x="310" y="867" class="s">损坏则备份恢复或报错</text>
  <path d="M494 846H529" class="line"/>
  <rect x="535" y="812" width="235" height="70" rx="13" fill="#dceee9" stroke="#b5d6ca"/>
  <text x="559" y="842" class="b">有档：恢复原地区与资产</text>
  <text x="559" y="867" class="s">无档：IP或默认选择后建档</text>
  <path d="M771 846H806" class="line"/>
  <rect x="812" y="812" width="226" height="70" rx="13" class="card"/>
  <text x="836" y="842" class="b">按时间恢复航程与鱼龄</text>
  <text x="836" y="867" class="s">退出仍计时 / 不自动产鱼</text>
  <path d="M1039 846H1073" class="line"/>
  <rect x="1079" y="812" width="227" height="70" rx="13" fill="#e5ecf8" stroke="#c2d1e8"/>
  <text x="1103" y="842" class="b">本地可玩 / 天气增强</text>
  <text x="1103" y="867" class="s">断网仍可交易与旅行</text>

  <rect x="54" y="917" width="1252" height="91" rx="14" fill="#fff" stroke="#d3dfe5"/>
  <text x="78" y="951" class="b" style="font-weight:700">当前核心规则</text>
  <text x="78" y="980" class="s">Windows 安装 EXE  ·  每次飞行付费  ·  全图距离映射 60–180 秒  ·  现实七天后每条 1 金币  ·  IP 每次识别累计解锁</text>
  <text x="54" y="1037" style="font-size:13px;fill:#6d8390">78 项自动测试通过；桌面诊断与安装包验证范围详见 ACCEPTANCE.md。</text>
</svg>


